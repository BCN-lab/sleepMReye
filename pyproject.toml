[project]
name = "SleepMReye"
version = "0.1.0"
requires-python = ">=3.11,<3.12"

dependencies = [
    "mreyemove",
]

authors = [
  { name = "Zach", email = "zachnudels@gmail.com" }
]

[tool.setuptools.packages.find]
include = ["sleepmreye*"]
exclude = ["nilearn_cache*"]


[project.entry-points."mreyemove.datasets"]
sleepmreye = "sleepmreye.sleep_mrio:SleepMRIO"


[project.scripts]
sleepmreye-fc-extract = "sleepmreye.extract_fc_matrices:cli_main"
sleepmreye-extract-eog = "sleepmreye.extract_eog:cli_main"
